[package]
name = "cn1-ble-helper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cn1-ble-helper"
path = "src/main.rs"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
futures = "0.3"
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
# Smaller helper = smaller cn1lib jar shipped to apps.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
