# Simulator menu hooks for the cn1-bluetooth cn1lib. Discovered by the CN1
# JavaSE port's SimulatorHookLoader when this jar is on the simulator
# classpath. Each item.action points at a public static no-arg method on
# BluetoothSimulatorHooks; the loader dispatches the call on the CN1 EDT.
#
# Items with a `label` show up in the simulator's "Bluetooth" menu AND are
# callable from CN1 UnitTests via CN.executeHook("bluetooth:<id>"). Items
# without a label are API-only — invisible in the menu, still callable
# from tests. The label-less form is how tests script state changes that
# would clutter the menu UX (e.g., "force the next read to fail").
name=Bluetooth
namespace=bluetooth

item1.id=toggleAdapter
item1.label=Toggle adapter on/off
item1.action=com.codename1.bluetoothle.BluetoothSimulatorHooks#toggleAdapter

item2.id=addDemoPeripheral
item2.label=Add demo peripheral
item2.action=com.codename1.bluetoothle.BluetoothSimulatorHooks#addDemoPeripheral

item3.id=disconnectAll
item3.label=Disconnect all peripherals
item3.action=com.codename1.bluetoothle.BluetoothSimulatorHooks#disconnectAll

item4.id=pushDemoNotification
item4.label=Push demo notification
item4.action=com.codename1.bluetoothle.BluetoothSimulatorHooks#pushDemoNotification

item5.id=clearPeripherals
item5.label=Clear peripherals
item5.action=com.codename1.bluetoothle.BluetoothSimulatorHooks#clearPeripherals

item6.id=switchToNativeBle
item6.label=Switch backend → native BLE (real hardware)
item6.action=com.codename1.bluetoothle.BluetoothSimulatorHooks#switchToNativeBle

item7.id=switchToSimulator
item7.label=Switch backend → simulator
item7.action=com.codename1.bluetoothle.BluetoothSimulatorHooks#switchToSimulator

# API-only: used by BluetoothSimulatorHooksTest to verify the
# CN.executeHook entry point and the label-less code path. Primes the
# simulator to fail the next "read" call with a scripted error, then
# tests assert the failure surfaces through the public Bluetooth API.
item8.id=primeReadFailure
item8.action=com.codename1.bluetoothle.BluetoothSimulatorHooks#primeReadFailure
