# Simulator menu hooks for the cn1-bluetooth cn1lib. Discovered by the CN1
# JavaSE port's SimulatorHookLoader when this jar is on the simulator
# classpath. Each itemN points at a public static no-arg method; the matching
# labelN becomes the menu text. Items are positional (item1 is first, item2
# second, ...) and the loader stops at the first missing itemN.
#
# Each entry is also callable cross-platform via CN.execute("bluetooth:itemN").
# Items without a labelN are API-only: registered with the executor but
# hidden from the menu — used by the test suite to prime scripted state.
name=Bluetooth
namespace=bluetooth

item1=com.codename1.bluetoothle.BluetoothSimulatorHooks#toggleAdapter
label1=Toggle adapter on/off

item2=com.codename1.bluetoothle.BluetoothSimulatorHooks#addDemoPeripheral
label2=Add demo peripheral

item3=com.codename1.bluetoothle.BluetoothSimulatorHooks#disconnectAll
label3=Disconnect all peripherals

item4=com.codename1.bluetoothle.BluetoothSimulatorHooks#pushDemoNotification
label4=Push demo notification

item5=com.codename1.bluetoothle.BluetoothSimulatorHooks#clearPeripherals
label5=Clear peripherals

item6=com.codename1.bluetoothle.BluetoothSimulatorHooks#switchToNativeBle
label6=Switch backend → native BLE (real hardware)

item7=com.codename1.bluetoothle.BluetoothSimulatorHooks#switchToSimulator
label7=Switch backend → simulator

# API-only: BluetoothSimulatorHooksTest fires this via CN.execute to
# verify the label-less branch + the cn1lib's error-propagation path.
item8=com.codename1.bluetoothle.BluetoothSimulatorHooks#primeReadFailure
