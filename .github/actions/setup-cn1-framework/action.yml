name: 'Setup Codename One framework'
description: >
  Clones codenameone/CodenameOne (master) and codenameone/cn1-binaries, then
  installs the 8.0-SNAPSHOT framework artifacts into the local ~/.m2 cache.
  The cn1lib at this version depends on framework features (SimulatorHookLoader,
  CoreBluetooth backend support) that have not been released yet, so CI must
  build the framework from source on every run that doesn't hit the cache.

inputs:
  cn1-ref:
    description: 'Git ref of codenameone/CodenameOne to build (branch/tag/sha).'
    required: false
    # TEMPORARY: while codenameone/CodenameOne#4988 is unmerged, this PR
    # needs the SimulatorHookLoader classes which only exist on the
    # framework PR's branch. Flip back to 'master' immediately after
    # #4988 merges (delete the branch reference here in the same commit
    # that lands this PR).
    default: 'feat/simulator-menu-hooks'

runs:
  using: composite
  steps:
    - name: Restore CN1 framework cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/com/codenameone
        # Bumping cn1-cache-version invalidates every cached framework.
        # Use that lever when CN1 master makes an incompatible change.
        key: cn1-framework-v1-${{ runner.os }}-${{ inputs.cn1-ref }}-${{ hashFiles('.github/cn1-framework-pin.txt') }}
        restore-keys: |
          cn1-framework-v1-${{ runner.os }}-${{ inputs.cn1-ref }}-

    - name: Set up JDK 8 for framework build
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-java@v4
      with:
        # Zulu instead of Temurin: Temurin ships no JDK 8 build for
        # macos-14 (Apple Silicon), which makes the ios-native-tests and
        # native-ble-helper macOS jobs fail their composite action with
        # "Could not find satisfied version for SemVer '8'". Zulu has
        # aarch64 JDK 8 binaries.
        distribution: zulu
        java-version: '8'

    - name: Clone CN1 + cn1-binaries
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      # RUNNER_TEMP rather than /tmp so Windows runners — where Git Bash
      # doesn't expose a usable Unix /tmp — get a real cross-platform
      # workspace path.
      run: |
        set -euo pipefail
        rm -rf "$RUNNER_TEMP/CodenameOne" "$RUNNER_TEMP/cn1-binaries"
        git clone --depth 1 --branch "${{ inputs.cn1-ref }}" \
          https://github.com/codenameone/CodenameOne.git "$RUNNER_TEMP/CodenameOne"
        git clone --depth 1 \
          https://github.com/codenameone/cn1-binaries.git "$RUNNER_TEMP/cn1-binaries"

    - name: Install CN1 build client
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/.codenameone"
        cp "$RUNNER_TEMP/CodenameOne/maven/CodeNameOneBuildClient.jar" \
           "$HOME/.codenameone/CodeNameOneBuildClient.jar"

    - name: Build + install CN1 framework artifacts
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      # !download-cn1-binaries disables the default profile that runs
      # `git clone cn1-binaries` inside the antrun phase. Without it the
      # build tries to re-clone into the same path on every reactor
      # module and dies with "destination path 'cn1-binaries' already
      # exists and is not an empty directory" — we already cloned it
      # ourselves to $RUNNER_TEMP/cn1-binaries above.
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/CodenameOne/maven"
        mvn -B -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true \
            -Plocal-dev-javase,!download-cn1-binaries \
            -Dcn1.binaries="$RUNNER_TEMP/cn1-binaries" \
            install

    - name: Report cache state
      shell: bash
      run: |
        if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          echo "CN1 framework restored from cache."
        else
          echo "CN1 framework built fresh."
        fi
        ls ~/.m2/repository/com/codenameone/ | head -20 || true
