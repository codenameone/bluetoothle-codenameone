name: Build

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build + install CN1 8.0-SNAPSHOT framework
      uses: ./.github/actions/setup-cn1-framework
    - name: Set up JDK 11 for cn1lib build
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Build cn1lib
      # -DskipNativeBleHelper=true keeps this generic build green on the
      # vanilla ubuntu-latest runner (no libdbus-1-dev, no cargo). The
      # dedicated native-ble-helper matrix job in native-bluetooth-tests.yml
      # is what actually verifies the helper builds + ships.
      run: mvn -B -DskipNativeBleHelper=true install
